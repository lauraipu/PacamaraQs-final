name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # El runner ubuntu-24.04 ya trae el Android SDK (ANDROID_HOME) con licencias
      # aceptadas; Gradle descarga solo la plataforma/build-tools que falten.
      - name: Verificar Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v6
        with:
          name: pacamaraqs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
