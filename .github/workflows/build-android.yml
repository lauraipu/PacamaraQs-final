name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # El runner ubuntu-24.04 ya trae el Android SDK (ANDROID_HOME) con licencias
      # aceptadas; Gradle descarga solo la plataforma/build-tools que falten.
      - name: Verificar Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v6
        with:
          name: pacamaraqs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # APK release (ofuscado con R8). Si existen los secretos ANDROID_KEYSTORE_*
      # se firma con la llave propia; si no, con la de depuración (solo pruebas).
      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pacamaraqs.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pacamaraqs.jks" >> "$GITHUB_ENV"
            echo "Se firmará con la llave del proyecto."
          else
            echo "Sin secretos de firma: el APK release se firma con la llave de depuración (solo pruebas)."
          fi

      - name: Compilar APK release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir APK release
        uses: actions/upload-artifact@v6
        with:
          name: pacamaraqs-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
