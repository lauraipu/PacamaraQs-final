<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>PacamaraSQ</title>

  <base href="/" />

  <!--
    CSP (auditoría 2026-11-03):
    · connect-src: se añade wss://*.supabase.co. Realtime usa WebSocket (wss) y
      una fuente "https://..." NO autoriza "wss://" en CSP3 → el canal fallaba
      y la app dependía solo del sondeo cada 4 s.
    · script-src: se quita 'unsafe-eval' (Angular AOT no lo necesita) y
      localhost:4200 (no debe ir a producción).
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: gap: https://ssl.gstatic.com;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src 'self' https://fonts.gstatic.com;
                 script-src 'self' 'unsafe-inline';
                 img-src 'self' data: blob:;
                 connect-src 'self' http://localhost:4200 ws://localhost:4200 https://*.supabase.co wss://*.supabase.co;">

  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#283840" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/icon/logopacamara.png" />
  

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
