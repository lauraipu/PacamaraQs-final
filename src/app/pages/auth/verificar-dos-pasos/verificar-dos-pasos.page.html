<ion-content class="ion-padding auth-content">
  <main class="auth-container">
    <div class="logo-box">
      <img src="assets/icon/logopacamara.png" [alt]="'login.logo_alt' | transloco">
    </div>
    <h1 class="title">{{ 'dos_pasos.verificar_titulo' | transloco }}</h1>
    <p class="subtitle">{{ 'dos_pasos.verificar_texto' | transloco }}</p>

    <form class="auth-card" (ngSubmit)="verificar()">
      <ion-input
        class="custom-input codigo-2fa"
        fill="outline"
        [label]="'dos_pasos.codigo' | transloco"
        labelPlacement="stacked"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="000000"
        [ngModel]="codigo()"
        (ngModelChange)="alEscribir($event)"
        name="codigo"
        required
      ></ion-input>
      <ion-button expand="block" type="submit" class="primary-btn" [disabled]="verificando()">
        @if (verificando()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>{{ 'dos_pasos.verificar' | transloco }}</span>
        }
      </ion-button>
      <p class="hint">{{ 'dos_pasos.ayuda_perdida' | transloco }}</p>
    </form>

    <button type="button" class="back-link" (click)="salir()">{{ 'dos_pasos.usar_otra_cuenta' | transloco }}</button>
  </main>
</ion-content>
