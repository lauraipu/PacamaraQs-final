<ion-content class="ion-padding login-content">
  <main class="login-container">
    <div class="logo-box">
      <img src="assets/icon/logopacamara.png" alt="Logo de Pacamara">
    </div>
    <h1 class="title">PacamaraSQ</h1>
    <p class="subtitle">Sistema de Evaluación CVA · SCA</p>

    <form class="login-form" (ngSubmit)="login()">
      <div class="form-group">
        <ion-input
          [(ngModel)]="email"
          name="email"
          label="Correo"
          labelPlacement="stacked"
          placeholder="nombre@lab.com"
          type="email"
          autocomplete="email"
          inputmode="email"
          fill="outline"
          class="custom-input"
          required
        ></ion-input>
      </div>

      <div class="form-group">
        <ion-input
          [(ngModel)]="password"
          name="password"
          label="Contraseña"
          labelPlacement="stacked"
          placeholder="Tu contraseña"
          type="password"
          autocomplete="current-password"
          fill="outline"
          class="custom-input"
          required
        ></ion-input>
      </div>

      <ion-button
        expand="block"
        type="submit"
        class="btn-login"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>Iniciar sesión</span>
        }
      </ion-button>

    </form>

    <p class="register-link">
      ¿No tienes cuenta?
      <a routerLink="/registro">Regístrate</a>
    </p>
  </main>
</ion-content>
