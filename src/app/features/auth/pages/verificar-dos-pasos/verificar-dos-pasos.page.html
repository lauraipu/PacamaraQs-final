<ion-content class="ion-padding auth-content">
  <main class="auth-container">
    <div class="logo-box">
      <img src="assets/icon/logopacamara.png" [alt]="'login.logo_alt' | transloco">
    </div>
    <h1 class="title">{{ 'dos_pasos.verificar_titulo' | transloco }}</h1>
    <p class="subtitle">{{ 'dos_pasos.verificar_texto' | transloco }}</p>

    <form class="auth-card" (ngSubmit)="verificar()">
      <app-codigo-otp
        [valor]="codigo()"
        (valorChange)="alEscribir($event)"
        [etiqueta]="'dos_pasos.codigo' | transloco"
        [deshabilitado]="verificando()"
        (enviar)="verificar()"
      ></app-codigo-otp>
      <ion-button expand="block" type="submit" class="primary-btn" [disabled]="verificando()">
        @if (verificando()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>{{ 'dos_pasos.verificar' | transloco }}</span>
        }
      </ion-button>
      <p class="hint">{{ 'dos_pasos.ayuda_perdida' | transloco }}</p>
    </form>

    <ion-button fill="clear" expand="block" class="otra-cuenta" (click)="salir()">
      <ion-icon slot="start" name="swap-horizontal-outline" aria-hidden="true"></ion-icon>
      {{ 'dos_pasos.usar_otra_cuenta' | transloco }}
    </ion-button>
  </main>
</ion-content>
