<fieldset class="gustos" [disabled]="deshabilitado">
  <legend class="gustos__header">
    <span class="flavor-tree__section-label">{{ 'gustos.gustos_predominantes' | transloco }}</span>
    <span class="gustos__count" [class.gustos__count--full]="actuales.length === maximo">{{ actuales.length }}/{{ maximo }}</span>
  </legend>
  <div class="gustos__list">
    @for (o of opciones; track o.clave) {
      <label class="gustos__item" [class.gustos__item--on]="estaMarcado(o.clave)" [class.gustos__item--off]="bloqueado(o.clave)">
        <input type="checkbox" [checked]="estaMarcado(o.clave)" [disabled]="bloqueado(o.clave)" (change)="alternar(o.clave, $event)">
        {{ o.etiqueta | tr }}
      </label>
    }
  </div>
  <p class="gustos__hint">{{ 'gustos.elige_maximo_2_gustos' | transloco }}</p>
</fieldset>
