<div class="progress-container">
  <div class="progress-header">
    <span class="label">Catadores que han terminado</span>
    <span class="value">{{ completados }} de {{ total }}</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" [style.width.%]="porcentaje"></div>
  </div>
  @if (completados < total) {
    <p class="progress-hint">Esperando a que los demás terminen...</p>
  }
  @if (completados === total && total > 0) {
    <p class="progress-hint success">¡Todos han terminado!</p>
  }
</div>
